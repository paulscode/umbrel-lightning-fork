name: Test

# The backend's tests, which need no node_modules, on every push; and the
# image itself built (amd64, not pushed), which is what catches a frontend
# that no longer compiles. Images are published by hand with buildx when a
# release is cut; nothing here pushes one.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend tests
        working-directory: apps/backend
        run: node --test test/

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64, not pushed)
        run: docker buildx build --platform linux/amd64 --tag umbrel-lightning-fork:ci .
