name: Test

# The backend's and the frontend helpers' tests on every push; and the
# image itself built (amd64, not pushed), which is what catches a frontend
# that no longer compiles. Images are published by hand with buildx when a
# release is cut; nothing here pushes one.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Some tests load express, big.js and lodash. Install scripts are
      # skipped: grpc's native build needs the image's Node 16, and no test
      # loads grpc.
      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Backend tests
        working-directory: apps/backend
        run: node --test test/
      # The frontend's helpers (wording and arithmetic) load without the
      # Vue build.
      - name: Frontend helper tests
        working-directory: apps/frontend
        run: node --test test/
      # Text from peers and services reaches the page (a peer's reason for
      # stopping a resize, invoice descriptions): never as HTML.
      - name: No v-html
        run: |
          if grep -rn "v-html" apps/frontend/src; then
            echo "v-html renders text as HTML; use text interpolation" >&2
            exit 1
          fi

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64, not pushed)
        run: docker buildx build --platform linux/amd64 --tag umbrel-lightning-fork:ci .
